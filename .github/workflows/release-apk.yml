name: Build & Release Shafaq APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'ملاحظات الإصدار (Release Notes)'
        required: false
        default: 'تحديث جديد لتطبيق شَفَق يحتوي على تحسينات وإصلاحات هامة.'

permissions:
  contents: write # Required for GH CLI to create releases and delete old tags

jobs:
  build-and-release:
    name: Build, Release & Notify
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install App Dependencies
        working-directory: ./apps/mobile
        run: npm ci

      - name: Build APK via Expo EAS
        working-directory: ./apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # 1. Start the build and wait for it to finish
          eas build --platform android --profile preview --non-interactive --wait
          
          # 2. Download the resulting APK and rename it to shafaq.apk
          eas build:download --platform android --profile preview --latest --output shafaq.apk

      - name: Generate Version Tag
        id: generate_tag
        run: |
          # Generate a sequential version tag based on the GitHub run number
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload APK
        working-directory: ./apps/mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.TAG_NAME }} shafaq.apk \
            --title "شَفَق ${{ env.TAG_NAME }}" \
            --notes "${{ github.event.inputs.release_notes }}"

      - name: Cleanup Old Releases (Keep Latest 2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/cleanup-releases.sh
          bash .github/scripts/cleanup-releases.sh

      - name: Send Telegram Notification
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOWNLOAD_URL: "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/shafaq.apk"
        run: |
          MESSAGE="🚀 <b>تحديث جديد لتطبيق شَفَق متاح الآن</b> 🚀

          📦 <b>رقم الإصدار:</b> ${{ env.TAG_NAME }}
          📝 <b>ملاحظات التحديث:</b> ${{ github.event.inputs.release_notes }}

          🔗 <a href=\"$DOWNLOAD_URL\">اضغط هنا لتحميل التحديث المباشر (APK)</a>"
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"
