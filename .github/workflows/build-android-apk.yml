name: Build & Release Android APK

on:
  push:
    branches:
      - migration/server-into-app
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Native Gradle APK Build & Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Caching & Performance
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: |
          npm install
          npm --prefix apps/mobile install

      - name: Prebuild Expo Native Android Project
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --clean

      - name: Configure Gradle Memory & Properties
        run: |
          cd apps/mobile/android
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.configureondemand=false" >> gradle.properties

      - name: Build Android Release APK via Gradle
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Prepare APK Artifact
        run: |
          mkdir -p build_output
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk build_output/shafaq.apk || cp apps/mobile/android/app/build/outputs/apk/release/*.apk build_output/shafaq.apk
          test -s build_output/shafaq.apk

      - name: Generate Version Tag
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.TAG_NAME }} build_output/shafaq.apk \
            --title "شَفَق ${{ env.TAG_NAME }}" \
            --notes "تحديث تلقائي جديد لتطبيق شَفَق يحتوي على جميع الميزات والهوية البصرية ونظام الأمان المحدث."

      - name: Cleanup Old Releases (Keep Only Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/cleanup-releases.sh
          bash .github/scripts/cleanup-releases.sh

      - name: Send Telegram Notification
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOWNLOAD_URL: "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/shafaq.apk"
        run: |
          MESSAGE="🚀 <b>تحديث جديد لتطبيق شَفَق متاح الآن (APK)</b> 🚀

          📦 <b>رقم الإصدار:</b> ${{ env.TAG_NAME }}
          ✨ <b>حالة البناء:</b> بناء آلي ناجح 100% بدون وسائط.

          🔗 <a href=\"$DOWNLOAD_URL\">اضغط هنا لتحميل ملف الـ APK المباشر وتثبيته</a>"
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"
