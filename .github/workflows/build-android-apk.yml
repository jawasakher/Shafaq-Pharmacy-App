name: Android APK Build Diagnostics (No Release)

on:
  push:
    branches:
      - migration/server-into-app
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-diagnose:
    name: Diagnose Android Gradle Build (No Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Record build environment
        shell: bash
        run: |
          mkdir -p build-diagnostics
          {
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Run ID: $GITHUB_RUN_ID"
          } | tee build-diagnostics/environment.txt

      - name: Install mobile dependencies from lockfile
        run: npm ci --prefix apps/mobile

      - name: Prebuild Expo Android project
        working-directory: apps/mobile
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
        shell: bash
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean 2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostics/expo-prebuild.log"

      - name: Build APK with diagnostic logging (not published)
        working-directory: apps/mobile/android
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"

          echo "Diagnostic build only. No GitHub Release will be created."

          ./gradlew assembleRelease \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-build.log"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shafaq-android-build-diagnostics-${{ github.run_number }}
          path: |
            build-diagnostics/**
            apps/mobile/android/build/reports/problems/**
          if-no-files-found: warn
          retention-days: 14
