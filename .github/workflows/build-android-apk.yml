name: Android APK Build Diagnostics (No Release)

on:
  push:
    branches:
      - migration/server-into-app
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-diagnose:
    name: Diagnose Android Gradle Build (No Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Record build environment
        shell: bash
        run: |
          mkdir -p build-diagnostics
          {
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Run ID: $GITHUB_RUN_ID"
          } | tee build-diagnostics/environment.txt

      - name: Install mobile dependencies from lockfile
        run: npm ci --prefix apps/mobile

      - name: Prebuild Expo Android project
        working-directory: apps/mobile
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
        shell: bash
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean 2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostics/expo-prebuild.log"

      - name: Configure Gradle memory and release ABIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/mobile/android/gradle.properties")
          text = path.read_text(encoding="utf-8")

          updates = {
              "org.gradle.jvmargs": "-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8",
              "org.gradle.workers.max": "2",
              "org.gradle.parallel": "false",
              "reactNativeArchitectures": "armeabi-v7a,arm64-v8a",
              "kotlin.daemon.jvmargs": "-Xmx1536m -XX:MaxMetaspaceSize=768m",
          }

          lines = text.splitlines()
          seen = set()
          result = []

          for line in lines:
              stripped = line.strip()
              if stripped and not stripped.startswith("#") and "=" in stripped:
                  key = stripped.split("=", 1)[0].strip()
                  if key in updates:
                      if key not in seen:
                          result.append(f"{key}={updates[key]}")
                          seen.add(key)
                      continue
              result.append(line)

          for key, value in updates.items():
              if key not in seen:
                  result.append(f"{key}={value}")

          path.write_text("\n".join(result).rstrip() + "\n", encoding="utf-8")

          verified = path.read_text(encoding="utf-8").splitlines()
          for key, value in updates.items():
              matches = [
                  line for line in verified
                  if line.strip().startswith(key + "=")
              ]
              if len(matches) != 1 or matches[0].split("=", 1)[1].strip() != value:
                  raise SystemExit(f"Invalid Gradle setting {key}: {matches}")
              print(matches[0])
          PY
      - name: Build APK with diagnostic logging (not published)
        working-directory: apps/mobile/android
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"

          echo "Diagnostic build only. No GitHub Release will be created."

          ./gradlew assembleRelease \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-build.log"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shafaq-android-build-diagnostics-${{ github.run_number }}
          path: |
            build-diagnostics/**
            apps/mobile/android/build/reports/problems/**
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
